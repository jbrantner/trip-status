name: Apply requests
# Every few minutes, add coworkers' profile and "Take this trip" requests to trips.json, then republish the site.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: apply-requests
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_requests.py
      - name: Save and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add trips.json tools/requests-state.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="Trip Status" -c user.email="actions@users.noreply.github.com" commit -m "Trips: apply requests"
          git push
          if ! git diff --quiet HEAD~1 -- trips.json; then gh api -X POST "repos/${{ github.repository }}/pages/builds" || true; fi
